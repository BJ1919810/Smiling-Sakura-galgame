<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- ★ 2026-09-19（Android 全屏/错位修复）：
         viewport-fit=cover 让 WebView 铺到刘海与系统栏之下（配合 MainActivity 的沉浸式全屏）；
         user-scalable=no 禁掉双指缩放（游戏画面由 Stage.fit() 自己等比缩放，浏览器缩放会与它打架）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23e8a0b4'/%3E%3Ccircle cx='11' cy='13' r='4' fill='%23f5c6d2'/%3E%3Ccircle cx='21' cy='13' r='4' fill='%23f5c6d2'/%3E%3Ccircle cx='16' cy='20' r='4' fill='%23f5c6d2'/%3E%3C/svg%3E"
    />
    <title>笑樱</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
